[package]
name = "nats-jetstream-pull-consumer"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "A pull consumer for NATS JetStream with pluggable interceptors and error strategies"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/agnosticeng/nats-jetstream-pull-consumer"
keywords = ["nats", "jetstream", "pull-consumer", "message-queue"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["sync"] }
async-nats = "0.46"
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
bytes = "1"
lz4_flex = "0"
serde = "1"
tracing = "0.1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }
